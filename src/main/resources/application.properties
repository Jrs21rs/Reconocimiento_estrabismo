spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Show SQL bind parameters
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
#Correo Electronico
#El servidor SMTP que usaremos. En este caso el de Gmail.
spring.mail.host=smtp.gmail.com
#El puerto que usa SMTP con SSL (seguridad).
spring.mail.port=465
#El Correo que envie los mensajes
spring.mail.username=${MAIL_USERNAME}
#Generamos una Contrase�a para apps externas con google
spring.mail.password=${MAIL_PASSWORD}
#obliga a que el servidor SMTP pida usuario y contrase�a.
spring.mail.properties.mail.smtp.auth=true
#Obliga a usar TLS (Transport Layer Security). Esto asegura que el correo viaje cifrado y no en texto plano.
spring.mail.properties.mail.smtp.ssl.enable=true

logging.level.org.springframework.mail=DEBUG

# CORS Configuration
spring.mvc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
server.forward-headers-strategy=framework
# Render sets PORT, map it to Spring server.port with default 8080
server.port=${PORT:8080}
